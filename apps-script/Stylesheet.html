<style>
:root{--bg:#07111f;--panel:#101d2e;--panel2:#13243a;--line:#243650;--text:#eef5ff;--muted:#8ea2bc;--cyan:#36d6d0;--green:#61df9a;--amber:#ffbd59;--red:#ff6b7a;--blue:#6f9bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#16345b 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;padding:26px 18px;border-right:1px solid var(--line);background:rgba(7,17,31,.92);display:flex;flex-direction:column;z-index:3}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 28px}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#397cf6);color:#06101c;font-size:21px;font-weight:900}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:11px}nav{display:grid;gap:7px}.nav-btn{border:0;border-radius:10px;padding:12px;text-align:left;background:transparent;color:var(--muted);font-weight:650;cursor:pointer}.nav-btn.active,.nav-btn:hover{color:var(--text);background:var(--panel2)}.privacy{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.privacy span{color:var(--green)}main{margin-left:238px;padding:30px 34px 20px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px}h1{font-size:30px;letter-spacing:-.03em;margin:0}#subtitle{color:var(--muted);margin:6px 0 0}.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px}button{cursor:pointer}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px}.card{background:linear-gradient(155deg,rgba(19,36,58,.96),rgba(12,26,43,.96));border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.card h3{margin:0 0 14px;font-size:14px}.kpi-label{color:var(--muted);font-size:12px}.kpi-value{font-size:29px;font-weight:820;letter-spacing:-.035em;margin:7px 0 3px}.kpi-note{color:var(--muted);font-size:11px}.accent{color:var(--cyan)}.good{color:var(--green)}.warn{color:var(--amber)}.danger{color:var(--red)}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(100px,1.3fr) 3fr 65px;gap:10px;align-items:center}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8d6e9;font-size:12px}.bar-track{height:8px;border-radius:99px;background:#203149;overflow:hidden}.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--cyan))}.bar-value{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}.stage{padding:12px 0;border-bottom:1px solid var(--line)}.stage:last-child{border:0}.stage-head{display:flex;justify-content:space-between;gap:10px}.stage small{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#1c3048;color:var(--cyan);font-size:11px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px}.table td:last-child,.table th:last-child{text-align:right}.donut-wrap{display:flex;align-items:center;gap:22px}.donut{width:125px;height:125px;border-radius:50%;display:grid;place-items:center}.donut:after{content:'';width:83px;height:83px;border-radius:50%;background:var(--panel)}.legend{display:grid;gap:8px;color:var(--muted)}.alert{padding:12px 14px;border:1px solid #773443;background:#371d29;color:#ffb6bf;border-radius:10px;margin-bottom:16px}.hidden
