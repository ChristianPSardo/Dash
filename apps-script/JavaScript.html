<script>
const VIEWS=[['executive','▦  Visão Executiva'],['replacements','↻  Reposições'],['cut','✂  Produzidas no Corte'],['quality','✓  Qualidade'],['auditCross','⚠  Auditoria × Reposições']];
const state={view:'executive',data:null,filters:{period:'all',unit:'Todas',status:'Todas'}};
const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n||0);const pct=n=>fmt(n)+'%';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function boot(){ $('nav').innerHTML=VIEWS.map(v=>`<button class="nav-btn ${v[0]===state.view?'active':''}" data-view="${v[0]}">${v[1]}</button>`).join(''); document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;boot();render()}); ['period','unit','status'].forEach(id=>$(id).onchange=()=>{state.filters[id]=$(id).value;load()}); $('refresh').onclick=load; load(); }
function load(){ $('content').innerHTML='<div class="loading"><span></span><p>Calculando indicadores…</p></div>'; $('alert').classList.add('hidden'); google.script.run.withSuccessHandler(data=>{state.data=data;hydrateFilters(data.filters);render();$('updated').textContent='Atualizado em '+data.updatedAt}).withFailureHandler(err=>{$('alert').textContent='Não foi possível ler a planilha: '+(err.message||err);$('alert').classList.remove('hidden');$('content').innerHTML=''}).getDashboardData(state.filters); }
function hydrateFilters(f){[['unit',f.units],['status',f.statuses]].forEach(([id,items])=>{const el=$(id),chosen=state.filters[id];el.innerHTML=items.map(x=>`<option ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')});$('period').value=state.filters.period;}
function render(){if(!state.data)return;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const titles={executive:['Visão Executiva','Panorama consolidado das solicitações, corte e qualidade.'],replacements:['Reposições','Volume, conclusão, backlog e evolução das peças solicitadas.'],cut:['Produzidas no Corte','Foco nos motivos, materiais, peças e etapas que pressionam a operação.'],quality:['Qualidade','Aprovação das auditorias e desempenho por turno produzido.'],auditCross:['Auditoria × Reposições','OTs auditadas pela Qualidade que também originaram solicitações de reposição.']};$('page-title').textContent=titles[state.view][0];$('subtitle').textContent=titles[state.view][1];$('content').innerHTML=({executive, replacements, cut, quality, auditCross}[state.view])();if(state.view==='auditCross')setTimeout(initWidthAnalysis,0);}
function kpi(label,value,note,tone='accent'){return `<article class="card"><div class="kpi-label">${esc(label)}</div><div class="kpi-value ${tone}">${value}</div><div class="kpi-note">${esc(note||'')}</div></article>`}
function bars(title,pairs,suffix=''){const max=Math.max(1,...pairs.map(x=>x[1]));return `<article class="card"><h3>${esc(title)}</h3><div class="bars">${pairs.map(([l,v])=>`<div class="bar-row" title="${esc(l)}"><span class="bar-label">${esc(l)}</span><span class="bar-track"><i class="bar-fill" style="width:${Math.max(2,v/max*100)}%"></i></span><span class="bar-value">${fmt(v)}${suffix}</span></div>`).join('')||'<span class="kpi-note">Sem dados no filtro atual.</span>'}</div></article>`}
function executive(){const d=state.data,s=d.summary,q=d.quality,c=d.cut;return `<div class="grid kpis">${kpi('Solicitações',fmt(s.totalRequests),'Registros no período')}${kpi('Peças em falta',fmt(s.missingPieces),pct(s.shortageRate)+' das peças totais','warn')}${kpi('Backlog de reposição',fmt(s.backlog),'Sem finalização e não canceladas','danger')}${kpi('Aprovação na qualidade',pct(q.approvalRate),fmt(q.approved)+' aprovadas','good')}</div><div class="grid two">${bars('Evolução mensal',d.monthly)}${bars('Áreas causadoras',d.areas)}</div><div class="grid three">${bars('Situação das solicitações',d.situations)}${bars('Motivos das solicitações',d.reasons)}<article class="card"><h3>Eficiência das reposições</h3>${mini('Conclusão',pct(c.completionRate))}${mini('Meta CD ≤ 2 dias',pct(c.slaRate))}${mini('Lead time CD mediano',fmt(c.leadTime.median)+' dias')}${mini('P90 até recebimento',fmt(c.leadTime.p90)+' dias')}</article></div>`}
function replacements(){const c=state.data.cut;return `<div class="grid kpis">${kpi('Registros',fmt(c.records),'Reposições filtradas')}${kpi('Quantidade',fmt(c.totalQty),'Volume registrado')}${kpi('Meta ≤ 2 dias',pct(c.slaRate),'Geração até recebimento no CD',c.slaRate>=90?'good':'warn')}${kpi('Backlog',fmt(c.backlog),fmt(c.cancelled)+' canceladas','danger')}</div><div class="grid two"><article class="card"><h3>Lead time até recebimento no CD</h3><div class="grid three">${mini('Média',fmt(c.leadTime.average)+' d')}${mini('Mediana',fmt(c.leadTime.median)+' d')}${mini('P90',fmt(c.leadTime.p90)+' d')}</div><p class="kpi-note">${fmt(c.leadTime.count)} entregas válidas · ${fmt(c.leadTime.ignoredOutliers)} tempos anômalos desconsiderados (acima de ${fmt(c.leadTime.outlierLimit)} dias).</p></article>${bars('Faixas de lead time até o CD',c.leadBuckets)}</div>${lineChart('Evolução das peças por Parte para Reposição',c.partTrend)}${lineChart('Evolução das peças por Motivo para Reposição',c.reasonTrend)}<div class="grid two">${bars('Status do abastecimento',c.supplyStatus)}${bars('Status de recebimento',c.receiveStatus)}</div>`}
function cut(){const c=state.data.cut;return `<div class="grid kpis">${kpi('Produzidas / finalizadas',fmt(c.completed),'Reposições com data final','good')}${kpi('Meta CD ≤ 2 dias',pct(c.slaRate),'Geração até recebimento no CD')}${kpi('Mediana corte → fim',fmt((c.stages[3]||{}).median)+' dias','Tempo típico da última etapa','accent')}${kpi('P90 corte → fim',fmt((c.stages[3]||{}).p90)+' dias','Cauda operacional','warn')}</div><div class="grid two"><article class="card"><h3>Tempo por etapa</h3>${c.stages.map(s=>`<div class="stage"><div class="stage-head"><strong>${esc(s.name)}</strong><span class="pill">mediana ${fmt(s.median)} d</span></div><small>Média ${fmt(s.average)} d · P90 ${fmt(s.p90)} d · ${fmt(s.count)} registros</small></div>`).join('')}</article>${bars('Principais motivos de corte',c.reasons)}</div><div class="grid three">${bars('Materiais',c.materials)}${bars('Peças / componentes',c.parts)}${bars('Status no corte',c.cutStatus)}</div>`}
function quality(){const q=state.data.quality;const degree=Math.max(0,Math.min(100,q.approvalRate))*3.6;return `<div class="grid kpis">${kpi('Auditorias',fmt(q.total),'Registros avaliados')}${kpi('Aprovadas',fmt(q.approved),pct(q.approvalRate)+' de aprovação','good')}${kpi('Reprovadas',fmt(q.rejected),'Pontos de atenção','danger')}${kpi('Desvio mediano',pct(q.medianDeviation),'Média '+pct(q.averageDeviation),'warn')}</div><div class="grid two"><article class="card"><h3>Índice de aprovação</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--green) ${degree}deg,var(--line) 0)"></div><div class="legend"><strong class="kpi-value good">${pct(q.approvalRate)}</strong><span>${fmt(q.approved)} aprovadas</span><span>${fmt(q.rejected)} reprovadas</span></div></div></article><article class="card"><h3>Desempenho por turno produzido</h3><table class="table"><thead><tr><th>Turno</th><th>Auditorias</th><th>Aprovação</th></tr></thead><tbody>${q.shifts.map(s=>`<tr><td>${esc(s.name)}</td><td>${fmt(s.total)}</td><td class="${s.rate>=90?'good':'warn'}">${pct(s.rate)}</td></tr>`).join('')}</tbody></table></article></div>`}
function auditCross(){const a=state.data.auditCross;return `<div class="grid kpis">${kpi('Auditorias realizadas',fmt(a.totalAudits),'Registros da aba Qualidade')}${kpi('OTs únicas auditadas',fmt(a.auditedOts),'Ordens distintas avaliadas')}${kpi('OTs auditadas com solicitação',fmt(a.matchedOts),'Encontradas na BASE ou REPOSIÇÕES','danger')}${kpi('Incidência sobre OTs auditadas',pct(a.incidenceRate),pct(a.auditIncidenceRate)+' das auditorias estão associadas','warn')}</div><div class="grid two">${monthlyCross(a.monthly)}${impactCard(a)}</div><div class="grid three">${bars('Situação atual das solicitações',a.requestStatuses)}${rateTable('Incidência por resultado da auditoria',a.byStatus)}${rateTable('Incidência por turno produzido',a.byShift)}</div>${widthExplorer()}<div class="grid two">${bars('Motivos associados às OTs auditadas',a.reasons)}${bars('Áreas causadoras associadas',a.areas)}</div>${detailTable(a.details)}`}
function monthlyCross(rows){const max=Math.max(1,...rows.map(r=>r.audits));return `<article class="card"><h3>Evolução mensal das inconsistências</h3><div class="bars">${rows.map(r=>`<div class="bar-row"><span class="bar-label">${esc(r.month)}</span><span class="bar-track" title="${fmt(r.matched)} de ${fmt(r.audits)} auditorias"><i class="bar-fill" style="width:${Math.max(2,r.matched/max*100)}%"></i></span><span class="bar-value">${fmt(r.matched)} · ${pct(r.rate)}</span></div>`).join('')}</div><p class="kpi-note">Barra: auditorias ligadas a solicitações · percentual sobre as auditorias do mês.</p></article>`}
function rateTable(title,rows){return `<article class="card"><h3>${esc(title)}</h3><table class="table"><thead><tr><th>Grupo</th><th>Encontradas</th><th>Taxa</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.matched)} / ${fmt(r.total)}</td><td class="${r.rate>0?'warn':'good'}">${pct(r.rate)}</td></tr>`).join('')}</tbody></table></article>`}
function detailTable(rows){return `<article class="card"><h3>OTs prioritárias para investigação</h3><div class="table-scroll"><table class="table"><thead><tr><th>OT</th><th>Artigo</th><th>Parte para reposição</th><th>Área causadora</th><th>Observação</th><th>Falta total</th><th>Resultado da auditoria</th><th>Solicitações</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.ot)}</strong></td><td>${esc(r.article)}</td><td>${esc(r.description)}</td><td>${esc(r.area)}</td><td class="wrap-cell">${esc(r.observation)}</td><td class="warn">${fmt(r.missingPieces)}</td><td>${esc(r.auditResult)}</td><td>${fmt(r.requests)}</td></tr>`).join('')}</tbody></table></div><p class="kpi-note">Exibidas as 20 OTs com maior número de solicitações. A falta total soma os registros da BASE vinculados à OT.</p></article>`}
function impactCard(a){return `<article class="card"><h3>Impacto das inconsistências</h3><div class="impact-grid">${mini('Solicitações vinculadas',fmt(a.matchedRequests))}${mini('Peças faltantes',fmt(a.matchedPieces))}${mini('OTs reincidentes',fmt(a.repeatOts))}${mini('OTs aprovadas com solicitação',fmt(a.approvedMatchedOts))}</div></article>`}
function widthExplorer(){return `<article class="card"><h3>Largura × peças faltantes</h3><p class="kpi-note">Selecione uma largura para detalhar a evolução diária.</p><div class="width-layout"><div id="width-bars" class="width-bars"></div><div id="width-scatter" class="chart-area"></div></div></article>`}
function initWidthAnalysis(){const rows=state.data.widthAnalysis||[],barsEl=$('width-bars');if(!barsEl)return;if(!rows.length){barsEl.innerHTML='<span class="kpi-note">Sem larguras válidas no filtro atual.</span>';return}if(!state.selectedWidth||!rows.some(r=>r.width===state.selectedWidth))state.selectedWidth=rows[0].width;const max=Math.max(...rows.map(r=>r.total),1);barsEl.innerHTML=rows.map(r=>`<button class="width-option ${r.width===state.selectedWidth?'active':''}" data-width="${esc(r.width)}"><span>${esc(r.width)}</span><i><b style="width:${r.total/max*100}%"></b></i><strong>${fmt(r.total)}</strong></button>`).join('');barsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.selectedWidth=b.dataset.width;initWidthAnalysis()});const selected=rows.find(r=>r.width===state.selectedWidth);$('width-scatter').innerHTML=scatterChart(selected)}
function scatterChart(item){const points=item?.points||[];if(!points.length)return '<span class="kpi-note">Sem pontos para a largura selecionada.</span>';const W=820,H=310,L=58,R=18,T=30,B=45,maxY=Math.max(...points.map(p=>p.pieces),1),step=points.length>1?(W-L-R)/(points.length-1):0;const xy=points.map((p,i)=>({x:L+i*step,y:T+(H-T-B)*(1-p.pieces/maxY),...p}));const grid=[0,.25,.5,.75,1].map(v=>{const y=T+(H-T-B)*(1-v);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="chart-grid"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmt(maxY*v)}</text>`}).join('');const dots=xy.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5"><title>${p.date}: ${fmt(p.pieces)} peças</title></circle>`).join('');const line=`<polyline points="${xy.map(p=>p.x+','+p.y).join(' ')}"/>`;return `<div class="chart-title">Largura ${esc(item.width)} · ${fmt(item.total)} peças</div><svg class="svg-chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${line}${dots}<text x="${L}" y="${H-12}">${esc(points[0].date)}</text><text x="${W-R}" y="${H-12}" text-anchor="end">${esc(points[points.length-1].date)}</text></svg>`}
function lineChart(title,data){const labels=data?.labels||[],series=data?.series||[];if(!labels.length||!series.length)return `<article class="card"><h3>${esc(title)}</h3><span class="kpi-note">Sem dados no filtro atual.</span></article>`;const W=1040,H=360,L=65,R=22,T=30,B=55,colors=['#36d6d0','#6f9bff','#ffbd59','#ff6b7a','#61df9a','#c084fc'],maxY=Math.max(1,...series.flatMap(s=>s.values)),x=i=>L+(labels.length>1?i*(W-L-R)/(labels.length-1):0),y=v=>T+(H-T-B)*(1-v/maxY);const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${L}" y1="${y(maxY*v)}" x2="${W-R}" y2="${y(maxY*v)}" class="chart-grid"/><text x="${L-8}" y="${y(maxY*v)+4}" text-anchor="end">${fmt(maxY*v)}</text>`).join('');const lines=series.map((s,si)=>`<polyline style="stroke:${colors[si%colors.length]}" points="${s.values.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${s.values.map((v,i)=>`<circle style="fill:${colors[si%colors.length]}" cx="${x(i)}" cy="${y(v)}" r="3"><title>${esc(s.name)} · ${labels[i]}: ${fmt(v)} peças</title></circle>`).join('')}`).join('');const legend=series.map((s,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(s.name)}</span>`).join('');return `<article class="card trend-card"><h3>${esc(title)}</h3><div class="chart-legend">${legend}</div><svg class="svg-chart" viewBox="0 0 ${W} ${H}">${grid}${lines}<text x="${L}" y="${H-15}">${esc(labels[0])}</text><text x="${W-R}" y="${H-15}" text-anchor="end">${esc(labels[labels.length-1])}</text></svg></article>`}
function mini(label,value){return `<div class="stage"><div class="kpi-label">${esc(label)}</div><strong>${value}</strong></div>`}
document.addEventListener('DOMContentLoaded',boot);
</script>
