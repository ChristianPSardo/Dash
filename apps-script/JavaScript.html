<script>
const VIEWS=[['executive','▦  Visão Executiva'],['replacements','↻  Reposições'],['cut','✂  Produzidas no Corte'],['quality','✓  Qualidade']];
const state={view:'executive',data:null,filters:{period:'all',unit:'Todas',status:'Todas'}};
const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n||0);const pct=n=>fmt(n)+'%';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function boot(){ $('nav').innerHTML=VIEWS.map(v=>`<button class="nav-btn ${v[0]===state.view?'active':''}" data-view="${v[0]}">${v[1]}</button>`).join(''); document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;boot();render()}); ['period','unit','status'].forEach(id=>$(id).onchange=()=>{state.filters[id]=$(id).value;load()}); $('refresh').onclick=load; load(); }
function load(){ $('content').innerHTML='<div class="loading"><span></span><p>Calculando indicadores…</p></div>'; $('alert').classList.add('hidden'); google.script.run.withSuccessHandler(data=>{state.data=data;hydrateFilters(data.filters);render();$('updated').textContent='Atualizado em '+data.updatedAt}).withFailureHandler(err=>{$('alert').textContent='Não foi possível ler a planilha: '+(err.message||err);$('alert').classList.remove('hidden');$('content').innerHTML=''}).getDashboardData(state.filters); }
function hydrateFilters(f){[['unit',f.units],['status',f.statuses]].forEach(([id,items])=>{const el=$(id),chosen=state.filters[id];el.innerHTML=items.map(x=>`<option ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')});$('period').value=state.filters.period;}
function render(){if(!state.data)return;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const titles={executive:['Visão Executiva','Panorama consolidado das solicitações, corte e qualidade.'],replacements:['Reposições','Volume, conclusão, backlog e tempo total de atendimento.'],cut:['Produzidas no Corte','Foco nos motivos, materiais, peças e etapas que pressionam a operação.'],quality:['Qualidade','Aprovação das auditorias e desempenho por turno produzido.']};$('page-title').textContent=titles[state.view][0];$('subtitle').textContent=titles[state.view][1];$('content').innerHTML=({executive, replacements, cut, quality}[state.view])();}
function kpi(label,value,note,tone='accent'){return `<article class="card"><div class="kpi-label">${esc(label)}</div><div class="kpi-value ${tone}">${value}</div><div class="kpi-note">${esc(note||'')}</div></article>`}
function bars(title,pairs,suffix=''){const max=Math.max(1,...pairs.map(x=>x[1]));return `<article class="card"><h3>${esc(title)}</h3><div class="bars">${pairs.map(([l,v])=>`<div class="bar-row" title="${esc(l)}"><span class="bar-label">${esc(l)}</span><span class="bar-track"><i class="bar-fill" style="width:${Math.max(2,v/max*100)}%"></i></span><span class="bar-value">${fmt(v)}${suffix}</span></div>`).join('')||'<span class="kpi-note">Sem dados no filtro atual.</span>'}</div></article>`}
function executive(){const d=state.data,s=d.summary,q=d.quality,c=d.cut;return `<div class="grid kpis">${kpi('Solicitações',fmt(s.totalRequests),'Registros no período')}${kpi('Peças em falta',fmt(s.missingPieces),pct(s.shortageRate)+' das peças totais','warn')}${kpi('Backlog de reposição',fmt(s.backlog),'Sem finalização e não canceladas','danger')}${kpi('Aprovação na qualidade',pct(q.approvalRate),fmt(q.approved)+' aprovadas','good')}</div><div class="grid two">${bars('Evolução mensal',d.monthly)}${bars('Áreas causadoras',d.areas)}</div><div class="grid three">${bars('Situação das solicitações',d.situations)}${bars('Motivos das solicitações',d.reasons)}<article class="card"><h3>Eficiência das reposições</h3>${mini('Conclusão',pct(c.completionRate))}${mini('SLA em até 7 dias',pct(c.slaRate))}${mini('Lead time mediano',fmt(c.leadTime.median)+' dias')}${mini('P90',fmt(c.leadTime.p90)+' dias')}</article></div>`}
function replacements(){const c=state.data.cut;return `<div class="grid kpis">${kpi('Registros',fmt(c.records),'Reposições filtradas')}${kpi('Quantidade',fmt(c.totalQty),'Volume registrado')}${kpi('Conclusão',pct(c.completionRate),fmt(c.completed)+' finalizadas','good')}${kpi('Backlog',fmt(c.backlog),fmt(c.cancelled)+' canceladas','danger')}</div><div class="grid two"><article class="card"><h3>Lead time total</h3><div class="grid three">${mini('Média',fmt(c.leadTime.average)+' d')}${mini('Mediana',fmt(c.leadTime.median)+' d')}${mini('P90',fmt(c.leadTime.p90)+' d')}</div></article>${bars('Faixas de lead time',c.leadBuckets)}</div><div class="grid two">${bars('Status do abastecimento',c.supplyStatus)}${bars('Status de recebimento',c.receiveStatus)}</div>`}
function cut(){const c=state.data.cut;return `<div class="grid kpis">${kpi('Produzidas / finalizadas',fmt(c.completed),'Reposições com data final','good')}${kpi('SLA ≤ 7 dias',pct(c.slaRate),'Do pedido à finalização')}${kpi('Mediana corte → fim',fmt((c.stages[3]||{}).median)+' dias','Tempo típico da última etapa','accent')}${kpi('P90 corte → fim',fmt((c.stages[3]||{}).p90)+' dias','Cauda operacional','warn')}</div><div class="grid two"><article class="card"><h3>Tempo por etapa</h3>${c.stages.map(s=>`<div class="stage"><div class="stage-head"><strong>${esc(s.name)}</strong><span class="pill">mediana ${fmt(s.median)} d</span></div><small>Média ${fmt(s.average)} d · P90 ${fmt(s.p90)} d · ${fmt(s.count)} registros</small></div>`).join('')}</article>${bars('Principais motivos de corte',c.reasons)}</div><div class="grid three">${bars('Materiais',c.materials)}${bars('Peças / componentes',c.parts)}${bars('Status no corte',c.cutStatus)}</div>`}
function quality(){const q=state.data.quality;const degree=Math.max(0,Math.min(100,q.approvalRate))*3.6;return `<div class="grid kpis">${kpi('Auditorias',fmt(q.total),'Registros avaliados')}${kpi('Aprovadas',fmt(q.approved),pct(q.approvalRate)+' de aprovação','good')}${kpi('Reprovadas',fmt(q.rejected),'Pontos de atenção','danger')}${kpi('Desvio mediano',pct(q.medianDeviation),'Média '+pct(q.averageDeviation),'warn')}</div><div class="grid two"><article class="card"><h3>Índice de aprovação</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--green) ${degree}deg,var(--line) 0)"></div><div class="legend"><strong class="kpi-value good">${pct(q.approvalRate)}</strong><span>${fmt(q.approved)} aprovadas</span><span>${fmt(q.rejected)} reprovadas</span></div></div></article><article class="card"><h3>Desempenho por turno produzido</h3><table class="table"><thead><tr><th>Turno</th><th>Auditorias</th><th>Aprovação</th></tr></thead><tbody>${q.shifts.map(s=>`<tr><td>${esc(s.name)}</td><td>${fmt(s.total)}</td><td class="${s.rate>=90?'good':'warn'}">${pct(s.rate)}</td></tr>`).join('')}</tbody></table></article></div>`}
function mini(label,value){return `<div class="stage"><div class="kpi-label">${esc(label)}</div><strong>${value}</strong></div>`}
document.addEventListener('DOMContentLoaded',boot);
</script>
